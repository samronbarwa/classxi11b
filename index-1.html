<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ClassTrack — XI-B</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--s1:#0f0f14;--s2:#16161d;
  --glass:rgba(255,255,255,0.04);--glass2:rgba(255,255,255,0.07);--glass3:rgba(255,255,255,0.11);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f2f2f7;--sub:rgba(255,255,255,0.5);--muted:rgba(255,255,255,0.28);
  --accent:#6e6af0;--accent-bg:rgba(110,106,240,0.12);--accent-glow:rgba(110,106,240,0.25);
  --green:#30d158;--green-bg:rgba(48,209,88,0.1);--green-glow:rgba(48,209,88,0.2);
  --amber:#ff9f0a;--red:#ff453a;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(0.25,0.46,0.45,0.94);--spring:cubic-bezier(0.34,1.56,0.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:var(--font);color:var(--text);font-size:14px;}
button{font-family:var(--font);cursor:pointer;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;transition:opacity .35s var(--ease),transform .35s var(--ease);}
.screen.out{opacity:0;transform:translateY(-18px) scale(0.97);pointer-events:none;}
.screen.below{opacity:0;transform:translateY(36px) scale(0.97);pointer-events:none;}
.bg-blob{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(110,106,240,0.12) 0%,transparent 60%),
  radial-gradient(ellipse 50% 40% at 85% 85%,rgba(48,209,88,0.05) 0%,transparent 50%),var(--bg);}

/* HOME */
#home{background:transparent;z-index:1;}
.home-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:40px;}
.home-scroll::-webkit-scrollbar{display:none;}
.hero{padding:60px 22px 28px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--glass2);border:1px solid var(--border2);border-radius:20px;padding:5px 13px;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:18px;backdrop-filter:blur(10px);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.title{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-bottom:10px;background:linear-gradient(150deg,#fff 40%,rgba(255,255,255,.6));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.title .acc{background:linear-gradient(135deg,#6e6af0,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub-txt{font-size:14px;color:var(--sub);line-height:1.6;max-width:290px;}
.edit-bar{padding:0 14px 14px;}
.edit-toggle{width:100%;padding:14px 18px;border-radius:16px;background:var(--glass);border:1px solid var(--border);color:var(--sub);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;backdrop-filter:blur(20px);transition:all .3s var(--ease);}
.edit-toggle:active{transform:scale(.98);}
.edit-toggle.on{background:rgba(110,106,240,.12);border-color:rgba(110,106,240,.4);color:#a78bfa;box-shadow:0 0 20px rgba(110,106,240,.12);}
.lock-icon{font-size:16px;transition:transform .4s var(--spring);}
.edit-toggle.on .lock-icon{transform:rotate(-20deg);}
.nav-cards{padding:0 14px;display:flex;flex-direction:column;gap:10px;}
.nav-card{background:var(--glass);border:1px solid var(--border);border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;backdrop-filter:blur(20px);transition:all .25s var(--ease);}
.nav-card:active{transform:scale(.97);}
.card-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.card-content{flex:1;}
.card-name{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px;}
.card-desc{font-size:12px;color:var(--sub);line-height:1.4;}
.card-prog{margin-top:8px;height:2px;background:var(--border);border-radius:1px;overflow:hidden;}
.card-prog-fill{height:100%;border-radius:1px;transition:width .6s var(--ease);}
.card-arrow{color:var(--muted);font-size:18px;flex-shrink:0;}

/* INNER HEADER */
.hdr{display:flex;align-items:center;gap:12px;padding:54px 14px 12px;flex-shrink:0;background:rgba(0,0,0,.5);backdrop-filter:blur(30px);border-bottom:1px solid var(--border);z-index:2;}
.back-btn{width:34px;height:34px;border-radius:50%;background:var(--glass2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent);font-size:18px;flex-shrink:0;transition:all .18s;}
.back-btn:active{transform:scale(.88);}
.hdr-title{font-size:19px;font-weight:700;flex:1;letter-spacing:-.02em;}
.hdr-hint{font-size:11px;color:var(--sub);}

/* SYLLABUS */
#syllabus{background:transparent;z-index:1;}
.syl-scroll{flex:1;overflow-y:auto;scrollbar-width:none;}
.syl-scroll::-webkit-scrollbar{display:none;}
.sub-cards{padding:14px 14px 40px;display:flex;flex-direction:column;gap:10px;}
.sub-card{background:var(--glass);border:1px solid var(--border);border-radius:18px;padding:17px 18px;display:flex;align-items:center;gap:13px;cursor:pointer;backdrop-filter:blur(20px);transition:all .22s var(--ease);animation:fadeUp .35s var(--ease) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.sub-card:active{transform:scale(.97);}
.sub-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.sub-info{flex:1;}
.sub-name{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px;}
.sub-meta{font-size:12px;color:var(--sub);margin-bottom:7px;}
.sub-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.sub-bar-fill{height:100%;border-radius:2px;transition:width .5s var(--ease);}
.ch-list-wrap{padding:0 0 40px;}
.ch-list-head{padding:12px 14px;border-bottom:1px solid var(--border);}
.ch-prog-lbl{font-size:12px;color:var(--sub);margin-bottom:7px;}
.ch-prog-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.ch-prog-fill{height:100%;border-radius:2px;transition:width .5s var(--ease);}
.chem-sec-hdr{padding:10px 14px 6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--s1);border-bottom:1px solid var(--border);border-top:1px solid var(--border);display:flex;align-items:center;gap:7px;}
.chem-sec-dot{width:6px;height:6px;border-radius:50%;}
.ch-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);animation:fadeUp .25s var(--ease) both;}
.ch-check{width:22px;height:22px;border:1.5px solid var(--border2);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .25s var(--spring);}
.ch-check.done{background:var(--green);border-color:var(--green);box-shadow:0 0 10px var(--green-glow);transform:scale(1.05);}
.ch-check.locked{cursor:default;opacity:.4;}
.ch-tick{font-size:12px;color:white;font-weight:800;opacity:0;transform:scale(0);transition:all .2s var(--spring);}
.ch-check.done .ch-tick{opacity:1;transform:scale(1);}
.ch-row-name{font-size:13px;flex:1;line-height:1.35;}
.ch-row-name.done{text-decoration:line-through;color:var(--muted);}

/* STUDIED */
#studied{background:transparent;z-index:1;}
.studied-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:14px 13px 40px;}
.studied-scroll::-webkit-scrollbar{display:none;}
.studied-mn{display:flex;align-items:center;gap:8px;padding:0 2px 14px;}
.mnav-btn{width:34px;height:34px;border-radius:50%;background:var(--glass);border:1px solid var(--border);color:var(--sub);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;backdrop-filter:blur(10px);}
.mnav-btn:active{transform:scale(.88);}
.month-lbl{font-size:17px;font-weight:700;flex:1;text-align:center;letter-spacing:-.02em;}
.studied-entries{display:flex;flex-direction:column;gap:9px;}
.studied-entry{background:var(--glass);border:1px solid var(--border2);border-radius:16px;padding:13px 15px;backdrop-filter:blur(20px);animation:fadeUp .3s var(--ease) both;}
.studied-sub-hdr{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.studied-chips{display:flex;flex-wrap:wrap;gap:6px;}
.studied-chip{font-size:12px;padding:5px 11px;border-radius:20px;font-weight:500;}
.no-studied{text-align:center;padding:44px 14px;color:var(--muted);font-size:13px;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:300;backdrop-filter:blur(8px);animation:bgIn .22s ease both;}
@keyframes bgIn{from{opacity:0;}to{opacity:1;}}
.modal{background:rgba(18,18,24,.98);border:1px solid var(--border2);border-radius:22px 22px 0 0;padding:6px 18px 40px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;animation:modalUp .32s var(--spring) both;}
@keyframes modalUp{from{transform:translateY(100%);}to{transform:none;}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 18px;}
.modal h3{font-size:18px;font-weight:700;margin-bottom:14px;letter-spacing:-.02em;}
.modal label{font-size:11px;color:var(--sub);display:block;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.modal input{width:100%;font-size:15px;padding:12px 13px;border:1px solid var(--border2);border-radius:12px;background:rgba(255,255,255,.05);color:var(--text);margin-bottom:10px;font-family:var(--font);outline:none;transition:border-color .18s;}
.modal input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.mbtns{display:flex;gap:8px;margin-top:8px;}
.mbtns button{flex:1;padding:13px;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);transition:all .18s;}
.mbtns button:active{transform:scale(.97);}
.bcnl{background:var(--glass2);color:var(--sub);}
.bsave{background:var(--accent);color:white;box-shadow:0 4px 18px var(--accent-glow);}
</style>
</head>
<body>
<div class="bg-blob"></div>
<div id="mRoot"></div>

<!-- HOME -->
<div class="screen" id="home">
  <div class="home-scroll">
    <div class="hero">
      <div class="chip"><div class="dot"></div>Science · Class XI-B</div>
      <div class="title">Class<span class="acc">Track</span></div>
      <div class="sub-txt">Your group's shared class tracker — syllabus and chapters in one place.</div>
    </div>
    <div class="edit-bar">
      <button class="edit-toggle" id="editToggle" onclick="openEdit()">
        <span class="lock-icon">🔒</span><span id="editLbl">Edit mode — locked</span>
      </button>
    </div>
    <div class="nav-cards">
      <div class="nav-card" onclick="goTo('syllabus')">
        <div class="card-icon" style="background:rgba(48,209,88,.1);border:1px solid rgba(48,209,88,.2);">📚</div>
        <div class="card-content">
          <div class="card-name">Syllabus</div>
          <div class="card-desc">Track chapter completion across all subjects</div>
          <div class="card-prog"><div class="card-prog-fill" id="overallFill" style="background:var(--green);width:0%"></div></div>
        </div>
        <div class="card-arrow">›</div>
      </div>
      <div class="nav-card" onclick="goTo('studied')">
        <div class="card-icon" style="background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.2);">🗒️</div>
        <div class="card-content">
          <div class="card-name">Chapters Studied</div>
          <div class="card-desc">See all chapters covered in class by subject</div>
        </div>
        <div class="card-arrow">›</div>
      </div>
    </div>
  </div>
</div>

<!-- SYLLABUS -->
<div class="screen below" id="syllabus">
  <div class="hdr">
    <div class="back-btn" onclick="sylBack()">‹</div>
    <div class="hdr-title" id="sylTitle">Syllabus</div>
    <div class="hdr-hint" id="sylHint"></div>
  </div>
  <div class="syl-scroll" id="sylContent"></div>
</div>

<!-- STUDIED -->
<div class="screen below" id="studied">
  <div class="hdr">
    <div class="back-btn" onclick="goHome()">‹</div>
    <div class="hdr-title">Chapters Studied</div>
  </div>
  <div class="studied-scroll">
    <div class="studied-mn">
      <button class="mnav-btn" onclick="changeM(-1)">‹</button>
      <div class="month-lbl" id="studiedMon"></div>
      <button class="mnav-btn" onclick="changeM(1)">›</button>
    </div>
    <div id="studiedList"></div>
  </div>
</div>

<script>
const SUBS=["Physics","Chemistry","Maths","Economics","CS","English"];
const SC={Physics:"#6e6af0",Chemistry:"#30d158",Maths:"#ff9f0a",Economics:"#bf5af2",CS:"#0a84ff",English:"#ff6b60"};
const SE={Physics:"⚡",Chemistry:"🧪",Maths:"📐",Economics:"📊",CS:"💻",English:"📖"};
const CHEM_SECTIONS=[
  {label:"Physical Chemistry",color:"#0a84ff",chapters:["Ch 1 — Some Basic Concepts of Chemistry","Ch 2 — Structure of Atom","Ch 5 — Thermodynamics","Ch 6 — Equilibrium","Ch 7 — Redox Reactions"]},
  {label:"Inorganic Chemistry",color:"#ff9f0a",chapters:["Ch 3 — Classification of Elements & Periodicity","Ch 4 — Chemical Bonding and Molecular Structure"]},
  {label:"Organic Chemistry",color:"#30d158",chapters:["Ch 8 — Organic Chemistry: Basic Principles","Ch 9 — Hydrocarbons"]},
];
const CHEM_FLAT=CHEM_SECTIONS.flatMap(s=>s.chapters);
const CHAPTERS={
  Physics:["Ch 1 — Units and Measurements","Ch 2 — Motion in a Straight Line","Ch 3 — Motion in a Plane","Ch 4 — Laws of Motion","Ch 5 — Work, Energy and Power","Ch 6 — System of Particles and Rotational Motion","Ch 7 — Gravitation","Ch 8 — Mechanical Properties of Solids","Ch 9 — Mechanical Properties of Fluids","Ch 10 — Thermal Properties of Matter","Ch 11 — Thermodynamics","Ch 12 — Kinetic Theory","Ch 13 — Oscillations","Ch 14 — Waves"],
  Chemistry:CHEM_FLAT,
  Maths:["Ch 1 — Sets","Ch 2 — Relations and Functions","Ch 3 — Trigonometric Functions","Ch 4 — Complex Numbers and Quadratic Equations","Ch 5 — Linear Inequalities","Ch 6 — Permutations and Combinations","Ch 7 — Binomial Theorem","Ch 8 — Sequences and Series","Ch 9 — Straight Lines","Ch 10 — Conic Sections","Ch 11 — Introduction to 3D Geometry","Ch 12 — Limits and Derivatives","Ch 13 — Statistics","Ch 14 — Probability"],
  Economics:["Ch 1 — Introduction to Statistics in Economics","Ch 2 — Collection of Data","Ch 3 — Organisation of Data","Ch 4 — Presentation of Data","Ch 5 — Measures of Central Tendency","Ch 6 — Measures of Dispersion","Ch 7 — Correlation","Ch 8 — Index Numbers","Ch 9 — Use of Statistical Tools","Ch 10 — Introduction to Microeconomics","Ch 11 — Consumer Equilibrium and Demand","Ch 12 — Producer Behaviour and Supply","Ch 13 — Forms of Market and Price Determination"],
  CS:["Ch 1 — Computer Systems and Organisation","Ch 2 — Computational Thinking & Programming — Basics","Ch 3 — Flow of Control","Ch 4 — Iterative Statements","Ch 5 — Strings and Lists","Ch 6 — Lists and Tuples","Ch 7 — Dictionary and Python Modules","Ch 8 — Society, Law and Ethics"],
  English:["Hornbill — Ch 1: The Portrait of a Lady","Hornbill — Poem: A Photograph","Hornbill — Ch 2: We're Not Afraid to Die","Hornbill — Ch 3: Discovering Tut","Hornbill — Poem: The Laburnum Top","Hornbill — Poem: The Voice of the Rain","Hornbill — Ch 4: The Ailing Planet","Hornbill — Poem: Childhood","Hornbill — Ch 5: The Adventure","Hornbill — Ch 6: Silk Road","Hornbill — Poem: Father to Son","Snapshots — Ch 1: The Summer of the Beautiful White Horse","Snapshots — Ch 2: The Address","Snapshots — Ch 3: Mother's Day","Snapshots — Ch 4: Birth","Snapshots — Ch 5: The Tale of Melon City","Writing Skills — Note-making & Summary","Writing Skills — Letter Writing","Writing Skills — Creative Writing","Grammar — Integrated Grammar Practice"],
};
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const PWS=["9b871512327c09ce91dd649b3f96a63b7408ef267c8cc5710114e629730cb61f","d86580a57f7bf542e85202283cb845953c9d28f80a8e651db08b2fc0b2d6a731","5966abd0cbfc86f98a186531b2b4ee5f6e910120ce13222f98207203dfc9a9a2","8efbbe9bc19ad2e043c6cdb187c0a0fedde70b6458443ce0b5648ec04ccf4cdf"];

let studiedM=new Date().getMonth(),studiedY=new Date().getFullYear();
let editMode=false,activeSylSub=null;
let failCount=parseInt(sessionStorage.getItem('f')||'0');
let lockedUntil=parseInt(sessionStorage.getItem('l')||'0');
let editTimer=null;

function load(){try{return JSON.parse(localStorage.getItem('ct')||'{}');}catch(e){return {};}}
function save(){try{localStorage.setItem('ct',JSON.stringify(data));}catch(e){}}
let data=load();

function goTo(id){
  const home=document.getElementById('home');
  home.classList.add('out');
  setTimeout(()=>{
    home.style.display='none';home.classList.remove('out');
    const scr=document.getElementById(id);
    scr.style.display='flex';scr.classList.remove('below');
    if(id==='syllabus')renderSyllabus();
    if(id==='studied')renderStudied();
  },250);
}
function goHome(){
  ['syllabus','studied'].forEach(id=>{
    const scr=document.getElementById(id);
    if(scr.style.display!=='none'&&!scr.classList.contains('below')){
      scr.classList.add('below');
      setTimeout(()=>{scr.style.display='none';scr.classList.remove('below');},300);
    }
  });
  document.getElementById('home').style.display='flex';
  document.getElementById('home').classList.remove('out');
  activeSylSub=null;updateOverall();
}

function updateOverall(){
  const prog=data.progress||{};
  let total=0,done=0;
  SUBS.forEach(s=>{total+=CHAPTERS[s].length;done+=CHAPTERS[s].filter((_,i)=>(prog[s]||{})[i]).length;});
  const pct=total?Math.round(done/total*100):0;
  const el=document.getElementById('overallFill');if(el)el.style.width=pct+'%';
}

function sylBack(){activeSylSub?((activeSylSub=null),renderSyllabus()):goHome();}

function renderSyllabus(){
  const content=document.getElementById('sylContent');
  const prog=data.progress||{};
  document.getElementById('sylHint').textContent=editMode?'✎ editing':'🔒 view only';
  if(activeSylSub){
    document.getElementById('sylTitle').textContent=activeSylSub;
    const color=SC[activeSylSub],chs=CHAPTERS[activeSylSub];
    const done=chs.filter((_,i)=>(prog[activeSylSub]||{})[i]).length;
    const pct=Math.round(done/chs.length*100);
    let html='<div class="ch-list-wrap"><div class="ch-list-head"><div class="ch-prog-lbl">'+done+' of '+chs.length+' chapters · '+pct+'%</div><div class="ch-prog-bar"><div class="ch-prog-fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
    if(activeSylSub==='Chemistry'){
      let gi=0;
      CHEM_SECTIONS.forEach(sec=>{
        html+='<div class="chem-sec-hdr"><div class="chem-sec-dot" style="background:'+sec.color+'"></div>'+sec.label+'</div>';
        sec.chapters.forEach(ch=>{
          const i=gi;const isDone=(prog.Chemistry||{})[i]||false;
          html+='<div class="ch-row" style="animation-delay:'+(i*.025)+'s"><div class="ch-check'+(isDone?' done':'')+(editMode?'':' locked')+'" onclick="toggleProg(\'Chemistry\','+i+')"><span class="ch-tick">✓</span></div><span class="ch-row-name'+(isDone?' done':'')+'">'+ch+'</span></div>';
          gi++;
        });
      });
    } else {
      chs.forEach((ch,i)=>{
        const isDone=(prog[activeSylSub]||{})[i]||false;
        html+='<div class="ch-row" style="animation-delay:'+(i*.025)+'s"><div class="ch-check'+(isDone?' done':'')+(editMode?'':' locked')+'" onclick="toggleProg(\''+activeSylSub+'\','+i+')"><span class="ch-tick">✓</span></div><span class="ch-row-name'+(isDone?' done':'')+'">'+ch+'</span></div>';
      });
    }
    html+='</div>';
    content.innerHTML=html;
  } else {
    document.getElementById('sylTitle').textContent='Syllabus';
    let html='<div class="sub-cards">';
    SUBS.forEach((sub,idx)=>{
      const color=SC[sub],chs=CHAPTERS[sub];
      const done=chs.filter((_,i)=>(prog[sub]||{})[i]).length;
      const pct=Math.round(done/chs.length*100);
      html+='<div class="sub-card" style="animation-delay:'+(idx*.06)+'s" onclick="openSylSub(\''+sub+'\')">';
      html+='<div class="sub-icon" style="background:'+color+'18;border:1px solid '+color+'25;">'+SE[sub]+'</div>';
      html+='<div class="sub-info"><div class="sub-name">'+sub+'</div><div class="sub-meta">'+chs.length+' chapters · '+done+' done</div><div class="sub-bar"><div class="sub-bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
      html+='<div class="card-arrow" style="color:'+color+'55;">›</div>';
      html+='</div>';
    });
    html+='</div>';
    content.innerHTML=html;
  }
}

function openSylSub(sub){activeSylSub=sub;renderSyllabus();}

function toggleProg(sub,i){
  if(!editMode){
    showModal('<div class="modal-handle"></div><h3>🔒 Locked</h3><p style="font-size:14px;color:var(--sub);margin-bottom:16px;">Go to home and unlock edit mode first.</p><div class="mbtns"><button class="bcnl" onclick="cModal()">Cancel</button><button class="bsave" onclick="cModal();goHome();openEdit()">Unlock</button></div>');
    return;
  }
  if(!data.progress)data.progress={};
  if(!data.progress[sub])data.progress[sub]={};
  data.progress[sub][i]=!data.progress[sub][i];
  if(data.progress[sub][i]){
    const t=new Date();
    const dk=t.getFullYear()+'-'+(t.getMonth()+1).toString().padStart(2,'0')+'-'+t.getDate().toString().padStart(2,'0');
    if(!data.studied)data.studied={};
    if(!data.studied[dk])data.studied[dk]=[];
    const chName=CHAPTERS[sub][i];
    if(!data.studied[dk].find(c=>c.sub===sub&&c.name===chName))
      data.studied[dk].push({sub,name:chName});
  }
  save();renderSyllabus();updateOverall();
}

function renderStudied(){
  document.getElementById('studiedMon').textContent=MONTHS[studiedM]+' '+studiedY;
  const list=document.getElementById('studiedList');
  const studied=data.studied||{};
  const bySub={};
  const total=new Date(studiedY,studiedM+1,0).getDate();
  for(let d=1;d<=total;d++){
    const dk=studiedY+'-'+(studiedM+1).toString().padStart(2,'0')+'-'+d.toString().padStart(2,'0');
    if(studied[dk]){
      studied[dk].forEach(ch=>{
        if(!bySub[ch.sub])bySub[ch.sub]=[];
        if(!bySub[ch.sub].includes(ch.name))bySub[ch.sub].push(ch.name);
      });
    }
  }
  const subs=Object.keys(bySub);
  if(!subs.length){list.innerHTML='<div class="no-studied">No chapters recorded this month</div>';return;}
  list.innerHTML='<div class="studied-entries">'+subs.map((sub,idx)=>{
    const chips=bySub[sub].map(name=>'<span class="studied-chip" style="background:'+SC[sub]+'18;color:'+SC[sub]+';border:1px solid '+SC[sub]+'30;">'+name+'</span>').join('');
    return '<div class="studied-entry" style="animation-delay:'+(idx*.05)+'s"><div class="studied-sub-hdr"><span style="font-size:16px;">'+SE[sub]+'</span><span style="color:'+SC[sub]+';">'+sub+'</span></div><div class="studied-chips">'+chips+'</div></div>';
  }).join('')+'</div>';
}

function changeM(d){
  studiedM+=d;
  if(studiedM>11){studiedM=0;studiedY++;}
  if(studiedM<0){studiedM=11;studiedY--;}
  renderStudied();
}

function showModal(inner){document.getElementById('mRoot').innerHTML='<div class="modal-bg" onclick="cModal(event)"><div class="modal" onclick="event.stopPropagation()">'+inner+'</div></div>';}
function cModal(e){if(!e||e.target.classList.contains('modal-bg'))document.getElementById('mRoot').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cModal();if(e.key==='Enter'&&e.target.id==='pwin')chkPw();});

async function sha256(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}

function openEdit(){
  if(editMode){editMode=false;clearTimeout(editTimer);updateEditUI();renderSyllabus();return;}
  const now=Date.now();
  if(lockedUntil>now){
    const s=Math.ceil((lockedUntil-now)/1000);
    showModal('<div class="modal-handle"></div><div style="text-align:center;padding:10px 0;"><img src="'+WRONG_IMG+'" alt="" style="width:100%;max-width:260px;border-radius:14px;margin-bottom:12px;background:#fff;"><p style="font-size:13px;color:var(--red);">Locked for '+s+' more seconds 🔒</p></div><div class="mbtns" style="margin-top:14px;"><button class="bsave" onclick="cModal()">OK</button></div>');
    return;
  }
  showModal('<div class="modal-handle"></div><h3>🔒 Enter Password</h3><input type="password" id="pwin" placeholder="Enter password" autocomplete="current-password"><div class="mbtns"><button class="bcnl" onclick="cModal()">Cancel</button><button class="bsave" onclick="chkPw()">Unlock</button></div>');
  setTimeout(()=>{const el=document.getElementById('pwin');if(el)el.focus();},120);
}

async function chkPw(){
  const val=document.getElementById('pwin').value;
  const hash=await sha256(val);
  if(PWS.includes(hash)){
    failCount=0;sessionStorage.setItem('f','0');sessionStorage.removeItem('l');
    editMode=true;updateEditUI();cModal();renderSyllabus();
    resetEditTimer();
  } else {
    failCount++;sessionStorage.setItem('f',failCount);
    cModal();
    if(failCount>=3){
      lockedUntil=Date.now()+5*60*1000;sessionStorage.setItem('l',lockedUntil);
      showModal('<div class="modal-handle"></div><div style="text-align:center;padding:10px 0 6px;"><img src="'+WRONG_IMG+'" alt="" style="width:100%;max-width:260px;border-radius:14px;margin-bottom:12px;background:#fff;"><p style="font-size:13px;color:var(--sub);margin-bottom:6px;">Too many wrong attempts!</p><p style="font-size:12px;color:var(--red);">Locked for 5 minutes 🔒</p></div><div class="mbtns" style="margin-top:14px;"><button class="bsave" onclick="cModal()">OK</button></div>');
    } else {
      showModal('<div class="modal-handle"></div><div style="text-align:center;padding:10px 0 6px;"><img src="'+WRONG_IMG+'" alt="" style="width:100%;max-width:260px;border-radius:14px;margin-bottom:12px;background:#fff;"><p style="font-size:13px;color:var(--sub);">Wrong password!</p><p style="font-size:12px;color:var(--muted);margin-top:4px;">'+(3-failCount)+' attempt(s) remaining</p></div><div class="mbtns" style="margin-top:14px;"><button class="bsave" onclick="cModal();openEdit()">Try Again</button></div>');
    }
  }
}

function resetEditTimer(){clearTimeout(editTimer);editTimer=setTimeout(()=>{editMode=false;updateEditUI();renderSyllabus();},30*60*1000);}

function updateEditUI(){
  const btn=document.getElementById('editToggle'),lbl=document.getElementById('editLbl');
  if(editMode){btn.classList.add('on');btn.querySelector('.lock-icon').textContent='🔓';lbl.textContent='Edit mode — unlocked · Tap to lock';}
  else{btn.classList.remove('on');btn.querySelector('.lock-icon').textContent='🔒';lbl.textContent='Edit mode — locked';}
  const h=document.getElementById('sylHint');if(h)h.textContent=editMode?'✎ editing':'🔒 view only';
}

updateOverall();
</script>
